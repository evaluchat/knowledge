name: okf-lint

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  okf-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run OKF lint
        run: python3 scripts/okf_lint.py
